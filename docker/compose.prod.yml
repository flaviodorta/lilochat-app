# LiloChat production v0 — single VPS, Docker Compose + Traefik (ADR-010).
# Run from the repo root on the server:
#   docker compose -f docker/compose.prod.yml --env-file /srv/lilochat/.env.prod up -d --build
#
# Required env (/srv/lilochat/.env.prod — NEVER committed):
#   DOMAIN=lilochat.example.com        ACME_EMAIL=you@example.com
#   POSTGRES_PASSWORD=<strong>         JWT_PRIVATE_KEY=<base64 pem>
#   JWT_PUBLIC_KEY=<base64 pem>        YOUTUBE_API_KEY=<phase 2>
name: lilochat

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--certificatesresolvers.le.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.le.acme.httpchallenge.entrypoint=web'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lilochat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lilochat']
      interval: 10s
      timeout: 5s
      retries: 10
    # no host ports: reachable only on the compose network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    image: lilochat/identity:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/services/identity/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # migrations first (roadmap 6.x moves this to a dedicated release step)
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy
             --schema apps/services/identity/prisma/schema.prisma
             && node apps/services/identity/dist/main.js"
    environment:
      NODE_ENV: production
      PORT: 4101
      IDENTITY_DATABASE_URL: postgresql://lilochat:${POSTGRES_PASSWORD}@postgres:5432/lilochat_identity
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      LOG_LEVEL: info

  api-gateway:
    image: lilochat/api-gateway:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4100
      IDENTITY_SERVICE_URL: http://identity:4101
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: info
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=4100

  web:
    image: lilochat/web:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  pgdata:
  letsencrypt:
