global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']

  # Per-queue depth (the DLQ>0 alert needs queue names — the aggregated
  # /metrics endpoint only has totals).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ['rabbitmq:15692']
